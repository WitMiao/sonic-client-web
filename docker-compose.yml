version: '3'
services:
  sonic-client-web:
    image: "ops-harbor.hypergryph.net/tech-center-dev/sonic-client-web:SONIC_WEB_VERSION"
    environment:
      - SONIC_SERVER_HOST
      - SONIC_SERVER_PORT
    networks:
      - sonic-network
    restart: on-failure
    ports:
      - "${SONIC_SERVER_PORT}:80"

networks:
  sonic-network:
    driver: bridge